openapi: 3.2.0
info:
  title: Krea Image API
  version: v1
  description: Image generation endpoints
servers:
- url: https://api.krea.ai
  description: Krea API
security:
- bearerAuth: []
tags:
- name: Image
  description: Image generation endpoints
paths:
  /generate/image/ideogram/ideogram-4.5:
    post:
      tags:
      - Image
      description: Generate images or edit source images with prompts and up to five image references. Very low quality requires an image. Set preserve_source_size to keep the first source image dimensions; aspect_ratio and resolution are then ignored.
      summary: Ideogram 4.5
      x-krea-pricing:
        type: fixed
        currency: USD
        unit: request
        price_points:
        - amount: 0.008
          dimensions:
            quality: very_low
            hasBaseImage: false
        - amount: 0.008
          dimensions:
            quality: very_low
            hasBaseImage: true
        - amount: 0.03
          dimensions:
            quality: low
            hasBaseImage: false
        - amount: 0.03
          dimensions:
            quality: low
            hasBaseImage: true
        - amount: 0.06
          dimensions:
            quality: medium
            hasBaseImage: false
        - amount: 0.06
          dimensions:
            quality: medium
            hasBaseImage: true
        - amount: 0.1
          dimensions:
            quality: high
            hasBaseImage: false
        - amount: 0.22
          dimensions:
            quality: high
            hasBaseImage: true
      x-mint:
        content: '## Pricing


          <Note>Fixed API prices in USD.</Note>


          | Quality | Base Image | Price |

          | --- | --- | ---: |

          | very_low | No | $0.008 |

          | very_low | Yes | $0.008 |

          | low | No | $0.03 |

          | low | Yes | $0.03 |

          | medium | No | $0.06 |

          | medium | Yes | $0.06 |

          | high | No | $0.10 |

          | high | Yes | $0.22 |


          <Accordion title="Deprecated request aliases">

          These aliases are accepted for compatibility only and are not shown in the request schema.


          | Deprecated | Use instead | Accepted until |

          | --- | --- | --- |

          | `preserveSourceSize` | `preserve_source_size` | 2026-06-19 |

          | `skipPromptExpansion` | `skip_prompt_expansion` | 2026-06-19 |

          </Accordion>'
      x-krea-deprecated-field-aliases:
      - from: preserveSourceSize
        to: preserve_source_size
        sunset_date: '2026-06-19'
        reason: Public API request fields are moving to snake_case.
        migration_url: https://docs.krea.ai/developers/deprecations#public-api-snake-case-fields
      - from: skipPromptExpansion
        to: skip_prompt_expansion
        sunset_date: '2026-06-19'
        reason: Public API request fields are moving to snake_case.
        migration_url: https://docs.krea.ai/developers/deprecations#public-api-snake-case-fields
      parameters:
      - name: X-Webhook-URL
        in: header
        required: false
        schema:
          type: string
          format: uri
        description: URL to receive a POST request when the job completes. The webhook will receive the job data including results. When signing is configured, deliveries are signed with ECDSA P-256 (ES256); verify them with the keys at https://api.krea.ai/.well-known/jwks.json (see X-Krea-Webhook-* headers). Treat requests without these headers as unauthenticated.
      requestBody:
        content:
          application/json:
            example:
              prompt: A mangrove forest, with roots weaving intricate patterns in tidal waters.
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 10000
                seed:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                quality:
                  default: high
                  type: string
                  enum:
                  - very_low
                  - low
                  - medium
                  - high
                preserve_source_size:
                  default: false
                  type: boolean
                skip_prompt_expansion:
                  default: false
                  type: boolean
                aspect_ratio:
                  default: '1:1'
                  type: string
                  enum:
                  - '1:1'
                  - '4:3'
                  - '3:2'
                  - '16:9'
                  - 2.4:1
                  - '4:5'
                  - '2:3'
                  - '9:16'
                  description: 'Aspect ratio. One of: 1:1, 4:3, 3:2, 16:9, 2.4:1, 4:5, 2:3, 9:16.'
                resolution:
                  default: 2K
                  type: string
                  enum:
                  - 2K
                  description: 'Resolution scale. One of: 2K.'
                image_urls:
                  description: Up to five source or reference images for prompt-based editing. Omit for text-to-image generation.
                  maxItems: 5
                  type: array
                  items:
                    type: string
                    maxLength: 1024
                    format: uri
                    description: Can be an external URL, base64 data URI, or uploaded asset URL.
              required:
              - prompt
              additionalProperties: false
      responses:
        '200':
          description: The resulting job data. This will be returned in a pending state until the job is completed. See [`/jobs/{id}`](#tag/default/get/jobs/{id}) for retrieving the results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  status:
                    type: string
                    enum:
                    - backlogged
                    - queued
                    - scheduled
                    - processing
                    - sampling
                    - intermediate-complete
                    - completed
                    - failed
                    - cancelled
                  created_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  completed_at:
                    type: 'null'
                  result:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    additionalProperties: false
                  progress:
                    anyOf:
                    - type: number
                      minimum: 0
                      maximum: 1
                    - type: 'null'
                required:
                - job_id
                - status
                - created_at
                - completed_at
                - result
                additionalProperties: false
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: You are not authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '402':
          description: You have run out of credits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '429':
          description: You have reached the maximum number of concurrent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: postGenerateImageIdeogramIdeogram45
      x-operation-id-source: derived
