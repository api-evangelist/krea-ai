          application/json:
            example: {}
            schema:
              type: object
              properties:
                target_width:
                  description: Output width in pixels. Defaults to the source width; output is scaled proportionally to at least 1920x1080 pixels in area.
                  type: number
                  minimum: 1
                  maximum: 8000
