      - Video Enhance
      description: A diffusion-based AI upscaler from Topaz that transforms low-resolution and degraded video into HD quality. Max 4K.
      summary: Topaz Starlight Precise
      deprecated: true
      x-krea-deprecation:
        sunset_date: '2026-11-16'
        replacement: enhance/topaz/starlight-fast-3
        reason: Topaz discontinued Starlight Fast 1 in October 2026. Requests already run on Starlight Fast 3.
        migration_url: https://docs.krea.ai/developers/deprecations#topaz-starlight-v1
      x-mint:
        content: '<Note>

          This model is deprecated as of 2026-11-16. Topaz discontinued Starlight Fast 1 in October 2026. Requests already run on Starlight Fast 3. Use `enhance/topaz/starlight-fast-3` instead. See the [migration guide](https://docs.krea.ai/developers/deprecations#topaz-starlight-v1).

