        description: Cursor for pagination
      - in: query
        name: owner
        schema:
          description: Filter node apps by owner. Use "workspace" to return only node apps shared with the current workspace.
          default: all
          type: string
          enum:
          - all
          - workspace
        description: Filter node apps by owner. Use "workspace" to return only node apps shared with the current workspace.
      responses:
        '200':
          description: Runnable node apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the node app
                        author_id:
                          type: string
                          description: ID of the node app author
                        workspace_id:
                          type: string
                          description: ID of the workspace that owns the node app
                        name:
                          type: string
                          description: Name of the node app
                        slug:
                          type: string
                          description: URL-friendly identifier for the node app
                        description:
                          type: string
                          description: Description of the node app
                        scope:
                          type: string
                          description: 'Visibility scope: "public", "user", or "workspace"'
                        created_at:
                          description: Creation timestamp
                          type: string
                        updated_at:
                          description: Last update timestamp
                          type: string
                        version:
                          type: number
                          description: Selected node app version number
                        version_created_at:
                          description: Creation timestamp of this version
                          type: string
                        username:
                          type: string
                          description: Username of the node app creator
                        example_outputs:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                          description: Example output URLs
                        input_openapi_schema:
                          anyOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                const: object
                              properties:
                                type: object
                                propertyNames:
                                  type: string
                                additionalProperties:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                  required:
                                  - type
                                  additionalProperties: {}
                              required:
                                type: array
                                items:
                                  type: string
                            required:
                            - type
                            - properties
                            additionalProperties: false
                            description: OpenAPI 3.1 JSON Schema
                          - type: 'null'
                          description: OpenAPI 3.1 JSON Schema for input parameters
                        output_openapi_schema:
                          anyOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                const: object
                              properties:
                                type: object
                                propertyNames:
                                  type: string
                                additionalProperties:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                  required:
