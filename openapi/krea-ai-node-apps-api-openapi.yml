                                  additionalProperties: {}
                              required:
                                type: array
                                items:
                                  type: string
                            required:
                            - type
                            - properties
                            additionalProperties: false
                            description: OpenAPI 3.1 JSON Schema
                          - type: 'null'
                          description: OpenAPI 3.1 JSON Schema for output values
                        node_app_version_id:
                          type: string
                          description: Node app version ID to pass to /node-apps/{id}/execute
                      required:
                      - id
                      - author_id
                      - workspace_id
                      - name
                      - slug
                      - description
                      - scope
                      - created_at
                      - updated_at
                      - version
                      - version_created_at
                      - username
                      - example_outputs
                      - input_openapi_schema
                      - output_openapi_schema
                      - node_app_version_id
                      additionalProperties: false
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
                additionalProperties: false
        '400':
          description: Invalid pagination parameters
          content:
