                  type: string
                  minLength: 1
                model_id:
                  default: eleven_multilingual_v2
                  description: ElevenLabs model ID. Defaults to eleven_multilingual_v2. Use eleven_v4 for ElevenLabs' most expressive, highest-quality model (best voice cloning, 90+ languages), or eleven_v4_turbo for low-latency generation.
                  type: string
                  minLength: 1
              required:
              - prompt
              additionalProperties: false
      responses:
        '200':
          description: The resulting job data. This will be returned in a pending state until the job is completed. See [`/jobs/{id}`](#tag/default/get/jobs/{id}) for retrieving the results.
