openapi: 3.2.0
info:
  title: Krea 3 D API
  version: v1
  description: 3D model generation endpoints
servers:
- url: https://api.krea.ai
  description: Krea API
security:
- bearerAuth: []
tags:
- name: 3 D
  description: 3D model generation endpoints
paths:
  /generate/3d/tencent/hunyuan3d-3.1-pro:
    post:
      tags:
      - 3 D
      description: High‑fidelity text or image‑to‑3D with optional PBR materials, multi‑view inputs, and adjustable face count for cleaner meshes.
      summary: Hunyuan3D 3.1 Pro
      parameters:
      - name: X-Webhook-URL
        in: header
        required: false
        schema:
          type: string
          format: uri
        description: URL to receive a POST request when the job completes. The webhook will receive the job data including results. When signing is configured, deliveries are signed with ECDSA P-256 (ES256); verify them with the keys at https://api.krea.ai/.well-known/jwks.json (see X-Krea-Webhook-* headers). Treat requests without these headers as unauthenticated.
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              type: object
              properties:
                prompt:
                  type: string
                seed:
                  type: number
                input_mode:
                  default: image
                  type: string
                  enum:
                  - image
                  - text
                generate_texture:
                  default: true
                  type: boolean
                enable_pbr:
                  type: boolean
                face_count:
                  type: number
                  minimum: 40000
                  maximum: 1500000
                back_image_url:
                  description: Optional back-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                left_image_url:
                  description: Optional left-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                right_image_url:
                  description: Optional right-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                top_image_url:
                  description: Optional top-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                bottom_image_url:
                  description: Optional bottom-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                left_front_image_url:
                  description: Optional left-front-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                right_front_image_url:
                  description: Optional right-front-view image URL.
                  type: string
                  maxLength: 1024
                  format: uri
                image_urls:
                  default: []
                  description: Input image URLs for image-to-3D generation. Omit or pass an empty array for text-to-3D.
                  type: array
                  items:
                    type: string
                    maxLength: 1024
                    format: uri
                    description: Can be an external URL, base64 data URI, or uploaded asset URL.
              additionalProperties: false
      responses:
        '200':
          description: The resulting job data. This will be returned in a pending state until the job is completed. See [`/jobs/{id}`](#tag/default/get/jobs/{id}) for retrieving the results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  status:
                    type: string
                    enum:
                    - backlogged
                    - queued
                    - scheduled
                    - processing
                    - sampling
                    - intermediate-complete
                    - completed
                    - failed
                    - cancelled
                  created_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  completed_at:
                    type: 'null'
                  result:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    additionalProperties: false
                  progress:
                    anyOf:
                    - type: number
                      minimum: 0
                      maximum: 1
                    - type: 'null'
                required:
                - job_id
                - status
                - created_at
                - completed_at
                - result
                additionalProperties: false
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: You are not authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '402':
          description: You have run out of credits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '429':
          description: You have reached the maximum number of concurrent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: postGenerate3dTencentHunyuan3d31Pro
      x-operation-id-source: derived
