openapi: 3.2.0
info:
  title: Krea Image Enhance API
  version: v1
  description: Image enhance endpoints
servers:
- url: https://api.krea.ai
  description: Krea API
security:
- bearerAuth: []
tags:
- name: Image Enhance
  description: Image enhance endpoints
paths:
  /generate/enhance/krea/enhance:
    post:
      tags:
      - Image Enhance
      description: Cheap creative enhancer for adding new details. Max 8K.
      summary: Krea Enhance
      x-mint:
        content: '<Accordion title="Deprecated request aliases">

          These aliases are accepted for compatibility only and are not shown in the request schema.


          | Deprecated | Use instead | Accepted until |

          | --- | --- | --- |

          | `imageUrl` | `image_url` | 2026-06-19 |

          </Accordion>'
      x-krea-deprecated-field-aliases:
      - from: imageUrl
        to: image_url
        sunset_date: '2026-06-19'
        reason: Public API request fields are moving to snake_case.
        migration_url: https://docs.krea.ai/developers/deprecations#public-api-snake-case-fields
      parameters:
      - name: X-Webhook-URL
        in: header
        required: false
        schema:
          type: string
          format: uri
        description: URL to receive a POST request when the job completes. The webhook will receive the job data including results. When signing is configured, deliveries are signed with ECDSA P-256 (ES256); verify them with the keys at https://api.krea.ai/.well-known/jwks.json (see X-Krea-Webhook-* headers). Treat requests without these headers as unauthenticated.
      requestBody:
        content:
          application/json:
            example:
              image_url: https://gen.krea.ai/images/0424f602-2999-4d0c-a46e-39cbf0ef384b.png
            schema:
              type: object
              properties:
                prompt:
                  default: ''
                  description: Text prompt describing the desired result.
                  type: string
                image_url:
                  type: string
                  maxLength: 1024
                  format: uri
                  description: Can be an external URL, base64 data URI, or uploaded asset URL.
                image_scaling_factor:
                  default: 2
                  description: Factor to scale the image resolution by (e.g. 2 means 2x; use 1 to skip upscaling).
                  type: number
                  minimum: 0.1
                rescale_color:
                  default: false
                  description: Match the original image color palette.
                  type: boolean
                seed:
                  description: Seed for reproducible results.
                  type: number
                ai_strength:
                  default: 0.4
                  description: AI strength — how much new detail the model generates. Higher values enhance more aggressively.
                  type: number
                  minimum: 0.1
                  maximum: 1
                clarity_strength:
                  default: 4
                  description: Clarity — how strongly the result follows the prompt.
                  type: number
                  minimum: 1
                  maximum: 12
                resemblance_strength:
                  default: 1
                  description: Resemblance — how faithfully the result preserves the original image structure.
                  type: number
                  minimum: 0
                  maximum: 2.5
                sharpness:
                  default: 0.5
                  description: Sharpness applied to fine detail. Does not affect generation of new detail.
                  type: number
                  minimum: 0.1
                  maximum: 1.5
              required:
              - image_url
              additionalProperties: false
      responses:
        '200':
          description: The resulting job data. This will be returned in a pending state until the job is completed. See [`/jobs/{id}`](#tag/default/get/jobs/{id}) for retrieving the results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  status:
                    type: string
                    enum:
                    - backlogged
                    - queued
                    - scheduled
                    - processing
                    - sampling
                    - intermediate-complete
                    - completed
                    - failed
                    - cancelled
                  created_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  completed_at:
                    type: 'null'
                  result:
                    type: 'null'
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    additionalProperties: false
                  progress:
                    anyOf:
                    - type: number
                      minimum: 0
                      maximum: 1
                    - type: 'null'
                required:
                - job_id
                - status
                - created_at
                - completed_at
                - result
                additionalProperties: false
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: You are not authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '402':
          description: You have run out of credits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '429':
          description: You have reached the maximum number of concurrent jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: postGenerateEnhanceKreaEnhance
      x-operation-id-source: derived
