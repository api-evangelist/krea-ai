openapi: 3.2.0
info:
  title: Krea General API
  version: v1
  description: Core API operations including job management and billing information
servers:
- url: https://api.krea.ai
  description: Krea API
security:
- bearerAuth: []
tags:
- name: General
  description: Core API operations including job management and billing information
paths:
  /jobs:
    get:
      tags:
      - General
      summary: List jobs
      description: List jobs with pagination and filtering. Returns jobs belonging to the authenticated user.
      parameters:
      - in: query
        name: cursor
        schema:
          description: ISO 8601 timestamp cursor for pagination (jobs created before this time)
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        description: ISO 8601 timestamp cursor for pagination (jobs created before this time)
      - in: query
        name: limit
        schema:
          default: 100
          description: 'Number of items to return (1-1000, default: 100)'
          type: integer
          minimum: 1
          maximum: 1000
        description: 'Number of items to return (1-1000, default: 100)'
      - in: query
        name: types
        schema:
          description: Comma-separated list of job types to filter (e.g., "flux,k1,externalImage")
          type: string
        description: Comma-separated list of job types to filter (e.g., "flux,k1,externalImage")
      - in: query
        name: status
        schema:
          description: Filter by job status
          type: string
          enum:
          - backlogged
          - queued
          - scheduled
          - processing
          - sampling
          - intermediate-complete
          - completed
          - failed
          - cancelled
        description: Filter by job status
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        job_id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        status:
                          type: string
                          enum:
                          - backlogged
                          - queued
                          - scheduled
                          - processing
                          - sampling
                          - intermediate-complete
                          - completed
                          - failed
                          - cancelled
                        created_at:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        completed_at:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        result:
                          type: object
                          properties:
                            urls:
                              anyOf:
                              - type: array
                                items:
                                  type: string
                                  format: uri
                              - type: array
                                items:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - model
                                      - preview
                                    url:
                                      type: string
                                      format: uri
                                  required:
                                  - type
                                  - url
                                  additionalProperties: false
                              - type: object
                                propertyNames:
                                  type: string
                                additionalProperties:
                                  type: string
                                  format: uri
                            style_id:
                              type: string
                          additionalProperties: false
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                          required:
                          - code
                          additionalProperties: false
                        progress:
                          anyOf:
                          - type: number
                            minimum: 0
                            maximum: 1
                          - type: 'null'
                        prompt:
                          type:
                          - string
                          - 'null'
                        model:
                          type:
                          - string
                          - 'null'
                      required:
                      - job_id
                      - status
                      - created_at
                      - prompt
                      - model
                      additionalProperties: false
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
                - next_cursor
                additionalProperties: false
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: getJobs
      x-operation-id-source: derived
  /jobs/{id}:
    get:
      tags:
      - General
      summary: Get a job by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: A unique identifier for a job
          example: 0388dc61-4291-49d4-8376-d49cc2ae49c9
        required: true
        description: A unique identifier for a job
      responses:
        '200':
          description: The most up-to-date state of the job. You can check when the job is completed by checking the `status` field. For completed loraTraining jobs, the result will include a `style_id` field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  status:
                    type: string
                    enum:
                    - backlogged
                    - queued
                    - scheduled
                    - processing
                    - sampling
                    - intermediate-complete
                    - completed
                    - failed
                    - cancelled
                  created_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  completed_at:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  result:
                    type: object
                    properties:
                      urls:
                        anyOf:
                        - type: array
                          items:
                            type: string
                            format: uri
                        - type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - model
                                - preview
                              url:
                                type: string
                                format: uri
                            required:
                            - type
                            - url
                            additionalProperties: false
                        - type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type: string
                            format: uri
                      style_id:
                        type: string
                    additionalProperties: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    additionalProperties: false
                  progress:
                    anyOf:
                    - type: number
                      minimum: 0
                      maximum: 1
                    - type: 'null'
                required:
                - job_id
                - status
                - created_at
                additionalProperties: false
        '404':
          description: The job was not found or the client is not authorized to see it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: getJobsById
      x-operation-id-source: derived
    delete:
      tags:
      - General
      summary: Delete a job by ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: A unique identifier for a job
          example: 0388dc61-4291-49d4-8376-d49cc2ae49c9
        required: true
        description: A unique identifier for a job
      responses:
        '200':
          description: The job was deleted successfully
        '404':
          description: The job was not found or the client is not authorized to delete it
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
                additionalProperties: false
      operationId: deleteJobsById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: Bearer
      type: http
